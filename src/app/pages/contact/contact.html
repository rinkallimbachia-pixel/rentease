<section class="page-card">
  <h1>Contact Us</h1>
  <p>Connect with our team to start your rental journey.</p>

  <div class="layout">
    <form>
      <label>
        Full Name
        <input type="text" placeholder="Enter your name" />
      </label>
      <label>
        Email
        <input type="email" placeholder="you@example.com" />
      </label>
      <label>
        City
        <input type="text" placeholder="Your city" />
      </label>
      <label>
        Message
        <textarea rows="4" placeholder="Tell us your requirement"></textarea>
      </label>
      <button type="button">Submit Inquiry</button>
    </form>

    <aside>
      <h3>RentEase Support</h3>
      <p>Email: support@rentease.in</p>
      <p>Phone: +91 90000 12345</p>
      <p>Service Hours: 9 AM - 8 PM</p>
      <a routerLink="/support">Go to Support Center</a>
    </aside>
  </div>
</section>
